{% extends 'base.html' %}

{% block title %}Add Category - Admin Dashboard{% endblock %}

{% block extra_css %}
<style>
.admin-nav {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    padding: 1rem;
    margin-bottom: 2rem;
}

.admin-nav .nav-link {
    color: white;
    font-weight: 600;
    padding: 0.75rem 1.5rem;
    border-radius: 10px;
    transition: all 0.3s ease;
}

.admin-nav .nav-link:hover,
.admin-nav .nav-link.active {
    background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
    color: white;
}
</style>
{% endblock %}

{% block content %}
<div class="admin-nav">
    <ul class="nav nav-pills">
        <li class="nav-item">
            <a class="nav-link" href="{% url 'shop:admin_dashboard' %}">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="{% url 'shop:admin_products' %}">
                <i class="bi bi-box-seam"></i> Products
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link active" href="{% url 'shop:admin_categories' %}">
                <i class="bi bi-folder2-open"></i> Categories
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="{% url 'shop:admin_orders' %}">
                <i class="bi bi-receipt"></i> Orders
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="{% url 'shop:admin_offers' %}">
                <i class="bi bi-tag"></i> Offers
            </a>
        </li>
    </ul>
</div>

<div class="container my-4" style="max-width: 650px;">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-white border-opacity-10">
        <div>
            <span class="badge bg-warning bg-opacity-25 text-warning px-3 py-1 rounded-pill small mb-2">
                <i class="bi bi-speedometer2 me-1"></i> Admin Portal
            </span>
            <h1 class="fw-bold text-white mb-0">Create New Category</h1>
        </div>
        <a href="{% url 'shop:admin_categories' %}" class="btn btn-outline-light rounded-pill px-3 py-2 small border-opacity-25">
            <i class="bi bi-arrow-left me-1"></i> Back to Categories
        </a>
    </div>

    <div class="card p-4 border-0 shadow-lg" data-tilt-3d style="background: rgba(255, 255, 255, 0.07); backdrop-filter: blur(16px); border-radius: 22px; border: 1px solid rgba(255, 255, 255, 0.12);">
        <form method="POST">
            {% csrf_token %}
            <div class="mb-4">
                <label class="form-label text-white fw-semibold mb-2">
                    <i class="bi bi-tag me-1 text-primary"></i> Category Name *
                </label>
                <input type="text" name="name" class="form-control" placeholder="e.g. Smartphones & Gadgets" required
                    style="background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 14px; padding: 12px 18px; color: #fff;">
            </div>

            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold fs-6 d-flex align-items-center justify-content-center gap-2">
                <i class="bi bi-check-circle-fill"></i> Save Category
            </button>
        </form>
    </div>
</div>
{% endblock %}
