{% extends 'base.html' %}

{% block title %}Sign In - ShopEase 3D{% endblock %}

{% block extra_css %}
<style>
/* =========================================================
   AUTH - 3D GLASS LOGIN
   ========================================================= */

.auth-wrapper {
    max-width: 460px;
    margin: 3rem auto 5rem;
    perspective: 1000px;
}

.auth-glass-card {
    background: rgba(255, 255, 255, 0.07);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 26px;
    padding: 2.8rem 2.2rem;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4), 0 0 30px rgba(255, 107, 53, 0.15);
    color: #ffffff;
    position: relative;
    overflow: hidden;
}

.auth-icon-orb {
    width: 80px;
    height: 80px;
    margin: 0 auto 1.5rem;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(255, 107, 53, 0.25), rgba(255, 140, 66, 0.15));
    border: 1px solid rgba(255, 107, 53, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffaa6b;
    font-size: 2.2rem;
    box-shadow: 0 0 25px rgba(255, 107, 53, 0.3);
}

.auth-title {
    font-size: 1.8rem;
    font-weight: 800;
    text-align: center;
    color: #ffffff;
    margin-bottom: 0.3rem;
}

.auth-sub {
    font-size: 0.95rem;
    color: rgba(255, 255, 255, 0.65);
    text-align: center;
    margin-bottom: 2rem;
}

.form-label-auth {
    font-size: 0.88rem;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.85);
    margin-bottom: 6px;
}

.input-auth-glass {
    background: rgba(0, 0, 0, 0.3) !important;
    border: 1px solid rgba(255, 255, 255, 0.15) !important;
    border-radius: 14px !important;
    padding: 12px 18px !important;
    color: #ffffff !important;
    font-size: 0.95rem;
    transition: all 0.3s ease;
}

.input-auth-glass:focus {
    background: rgba(0, 0, 0, 0.45) !important;
    border-color: var(--primary) !important;
    box-shadow: 0 0 20px rgba(255, 107, 53, 0.35) !important;
    color: #ffffff !important;
}

.input-auth-glass::placeholder {
    color: rgba(255, 255, 255, 0.4);
}
</style>
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-glass-card" data-tilt-3d>
        <div class="auth-icon-orb">
            <i class="bi bi-person-lock"></i>
        </div>

        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-sub">Enter your credentials to access your account</p>

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label for="username" class="form-label-auth"><i class="bi bi-person me-1"></i> Username</label>
                <input type="text" class="form-control input-auth-glass" id="username" name="username" placeholder="Enter your username" required autocomplete="username">
            </div>

            <div class="mb-4">
                <label for="password" class="form-label-auth"><i class="bi bi-key me-1"></i> Password</label>
                <input type="password" class="form-control input-auth-glass" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold fs-6 d-flex align-items-center justify-content-center gap-2 mb-3">
                <i class="bi bi-box-arrow-in-right"></i> Sign In to Account
            </button>

            <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
                <span class="text-white-50 small">New to ShopEase?</span>
                <a href="{% url 'shop:signup' %}" class="fw-bold text-decoration-none ms-1" style="color: #ffaa6b;">
                    Create an account <i class="bi bi-arrow-right"></i>
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
