{% extends 'base.html' %}

{% block title %}Create Account — ShopEase 3D{% endblock %}

{% block extra_css %}
<style>
.auth-wrapper {
    max-width: 480px;
    margin: 3.5rem auto 5rem;
    perspective: 1000px;
}

.auth-glass-card {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 28px;
    padding: 3rem 2.4rem;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 0 0 35px rgba(99, 102, 241, 0.15);
    color: #ffffff;
    position: relative;
    overflow: hidden;
}

.auth-icon-orb {
    width: 76px;
    height: 76px;
    margin: 0 auto 1.5rem;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.25), rgba(56, 189, 248, 0.2));
    border: 1px solid rgba(165, 180, 252, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #38bdf8;
    font-size: 2rem;
    box-shadow: 0 0 25px rgba(56, 189, 248, 0.3);
}

.auth-title {
    font-size: 1.85rem;
    font-weight: 800;
    text-align: center;
    color: #ffffff;
    margin-bottom: 0.3rem;
}

.auth-sub {
    font-size: 0.92rem;
    color: var(--pearl-muted);
    text-align: center;
    margin-bottom: 2rem;
}

.form-label-auth {
    font-size: 0.88rem;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.85);
    margin-bottom: 6px;
}

.input-auth-glass {
    background: rgba(0, 0, 0, 0.35) !important;
    border: 1px solid rgba(255, 255, 255, 0.14) !important;
    border-radius: 14px !important;
    padding: 12px 18px !important;
    color: #ffffff !important;
    font-size: 0.95rem;
    transition: all 0.3s ease;
}

.input-auth-glass:focus {
    background: rgba(0, 0, 0, 0.5) !important;
    border-color: rgba(165, 180, 252, 0.5) !important;
    box-shadow: 0 0 20px rgba(165, 180, 252, 0.25) !important;
    color: #ffffff !important;
}

.input-auth-glass::placeholder {
    color: rgba(255, 255, 255, 0.35);
}
</style>
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-glass-card" data-tilt-3d>
        <div class="auth-icon-orb">
            <i class="bi bi-person-plus-fill"></i>
        </div>

        <h1 class="auth-title">Create Account</h1>
        <p class="auth-sub">Join ShopEase for seamless 3D shopping and instant tracking</p>

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label for="username" class="form-label-auth"><i class="bi bi-person me-1"></i> Username *</label>
                <input type="text" class="form-control input-auth-glass" id="username" name="username" placeholder="Choose a unique username" required autocomplete="username">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label-auth"><i class="bi bi-envelope me-1"></i> Email Address *</label>
                <input type="email" class="form-control input-auth-glass" id="email" name="email" placeholder="name@example.com" required autocomplete="email">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label-auth"><i class="bi bi-key me-1"></i> Password *</label>
                <input type="password" class="form-control input-auth-glass" id="password" name="password" placeholder="Create a strong password" required autocomplete="new-password">
            </div>

            <div class="mb-4">
                <label for="password2" class="form-label-auth"><i class="bi bi-shield-check me-1"></i> Confirm Password *</label>
                <input type="password" class="form-control input-auth-glass" id="password2" name="password2" placeholder="Re-enter password" required autocomplete="new-password">
            </div>

            <button type="submit" class="btn-prism w-100 py-3 fw-bold fs-6 mb-3">
                <i class="bi bi-check-circle-fill"></i> Complete Registration
            </button>

            <div class="text-center mt-4 pt-3 border-top border-white border-opacity-10">
                <span class="text-pearl-muted small">Already have an account?</span>
                <a href="{% url 'shop:login' %}" class="fw-bold text-decoration-none ms-1 text-iridescent">
                    Sign in here <i class="bi bi-arrow-right"></i>
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
